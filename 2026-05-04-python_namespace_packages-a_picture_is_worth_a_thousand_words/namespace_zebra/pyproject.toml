[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "namespace_zebra"
version = "0.1.0"

[tool.setuptools]
package-dir = {"" = "src/lib"}

# optional
script-files = ["src/bin/zebra-wrapper.py"]

[project.scripts]

# optional
zebra-bray = "animals.zebra:do_zebra_run"
